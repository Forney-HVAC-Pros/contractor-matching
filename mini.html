// ============================================================
// MATCHING LOGIC
// ============================================================
function getMatches() {
  if (answers.urgency === 'emergency') {
    return [CONTRACTORS.jandr, CONTRACTORS.infinity];
  }

  var scores = { jandr:0, williams:0, bolton:0, infinity:0, schnorrbusch:0, absolute:0, accurate:0, coolcasa:0, copeland:0, mhc:0 };

  QUESTIONS.forEach(function(q) {
    var val = answers[q.id];
    if (!val) return;
    var opt = q.options.find(function(o) { return o.value === val; });
    if (!opt || !opt.scores) return;
    Object.keys(opt.scores).forEach(function(id) { scores[id] += opt.scores[id]; });
  });

  var locAdj = (answers.location && LOCATION_SCORES[answers.location]) || {};
  Object.keys(locAdj).forEach(function(id) { if (scores[id] !== undefined) scores[id] += locAdj[id]; });

  var sorted = Object.keys(scores).sort(function(a, b) { return scores[b],scores[a]; });
  var vals = sorted.map(function(id) { return scores[id]; });

  return vals[0],vals[1] <= 4
    ? [CONTRACTORS[sorted[0]], CONTRACTORS[sorted[1]]]
    : [CONTRACTORS[sorted[0]]];
}

function getReason(contractorId) {
  var r = REASONS[contractorId];
  if (!r) return '';
  if (answers.urgency === 'emergency' && r.emergency) return r.emergency;
  if (answers.service && r[answers.service]) return r[answers.service];
  return r.default;
}

function renderQuestion() {
  var q = QUESTIONS[step];
  document.getElementById('q-title').innerHTML = q.title;

  var container = document.getElementById('options');
  container.innerHTML = '';

  q.options.forEach(function(opt) {
    var btn = document.createElement('button');
    btn.className = 'option' + (answers[q.id] === opt.value ? ' selected' : '');
    btn.onclick = function() { selectOption(q.id, opt.value, btn); };
    btn.innerHTML = opt.label;
    container.appendChild(btn);
  });

  document.getElementById('back-btn').classList.toggle('hidden', step === 0);
  updateStepIndicator();

  var qs = document.getElementById('question-screen');
  qs.classList.remove('animate-in');
  void qs.offsetWidth;
  qs.classList.add('animate-in');

  sendHeight();
}

function selectOption(qId, value, btnEl) {
  answers[qId] = value;
  document.querySelectorAll('.option').forEach(function(b) { b.classList.remove('selected'); });
  btnEl.classList.add('selected');
  track('mini_question_answered', { question: qId, answer: value });
  setTimeout(advance, 420);
}

function advance() {
  if (step < QUESTIONS.length,1) {
    step++;
    renderQuestion();
    scrollUp();
  } else {
    showResults();
  }
}

function goBack() {
  if (step > 0) {
    step--;
    renderQuestion();
    scrollUp();
  }
}

function updateStepIndicator() {
  var pct = ((step + 1) / QUESTIONS.length) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
}

// ============================================================
// RENDER RESULTS
// ============================================================
function showResults() {
  var matches = getMatches();
  var isEmergency = answers.urgency === 'emergency';

  document.getElementById('question-screen').classList.add('hidden');
  document.getElementById('progress-track').classList.add('hidden');
  document.getElementById('tool-intro').classList.add('hidden');

  var rs = document.getElementById('results-screen');
  rs.classList.remove('hidden', 'animate-in');
  void rs.offsetWidth;
  rs.classList.add('animate-in');

  document.getElementById('r-title').textContent = isEmergency ? 'Emergency Recommendations' : (matches.length > 1 ? 'Your Top Matches' : 'Your Best Match');
  document.getElementById('r-sub').textContent = isEmergency
    ? 'Call directly for the fastest emergency response'
    : 'Based on your answers, here\'s who we recommend';

  var container = document.getElementById('r-contractors');
  container.innerHTML = '';

  matches.forEach(function(c, i) {
    if (i === 1) {
      var lbl = document.createElement('p');
      lbl.className = 'second-label';
      lbl.textContent = '- Also a great fit -';
      container.appendChild(lbl);
    }
    container.appendChild(buildCard(c, i === 0));
  });

  track('mini_results_viewed', { primary: matches[0].id, second: (matches[1] || {}).id || 'none' });
  sendHeight();
  scrollUp();
}

function buildCard(c, isPrimary) {
  var card = document.createElement('div');
  card.className = 'c-card' + (isPrimary ? ' primary' : '');

  var isDesktop = window.innerWidth > 900 && !('ontouchstart' in window) && navigator.maxTouchPoints === 0;
  var callBtn = isDesktop
    ? '<button class="btn-call" onclick="revealPhone(this,\'' + c.phoneHref + '\',\'' + c.phone + '\',\'' + c.id + '\')">' +
        'See Phone Number' +
      '</button>'
    : '<a href="' + c.phoneHref + '" class="btn-call" target="_blank" rel="noopener" onclick="trackCall(\'' + c.id + '\')">' +
        'Call Now' +
      '</a>';

  card.innerHTML =
    '<div class="c-header">' +
      '<div class="c-name">' + c.name + '</div>' +
      '<span class="c-badge' + (isPrimary ? ' primary' : '') + '">' + c.badge + '</span>' +
    '</div>' +
    '<div class="c-rating"><strong>' + c.rating.toFixed(1) + '&#9733;</strong> &nbsp;(' + c.reviews + ' reviews)</div>' +
    '<div class="c-reason">' + getReason(c.id) + '</div>' +
    '<div class="c-actions">' +
      callBtn +
      '<a href="https://forneyhvacpros.com/find-contractor" class="btn-quote" target="_blank" rel="noopener">' +
        'Get Free Quote' +
      '</a>' +
    '</div>';

  return card;
}

// ============================================================
// PHONE REVEAL (desktop)
// ============================================================
function revealPhone(btn, href, phone, contractorId) {
  trackCall(contractorId);
  btn.outerHTML = '<a href="' + href + '" class="btn-call" target="_blank" rel="noopener">' + phone + '</a>';
}

function trackCall(contractorId) {
  track('mini_call_clicked', { contractor: contractorId });
}

// ============================================================
// UTILITIES
// ============================================================
function scrollUp() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

function sendHeight() {
  setTimeout(function() {
    var h = document.documentElement.scrollHeight;
    window.parent.postMessage({ iframeHeight: h }, '*');
  }, 50);
}

function track(event, params) {
  if (typeof gtag !== 'undefined') gtag('event', event, params || {});
}

// ============================================================
// INIT
// ============================================================
(function() {
  renderQuestion();
  track('mini_tool_started');
  window.addEventListener('load', sendHeight);
  window.addEventListener('resize', sendHeight);
})();
</script>
